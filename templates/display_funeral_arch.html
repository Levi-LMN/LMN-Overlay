<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In Memoriam — Lower Third (Arch)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night-a:   #172033;
    --night-b:   #0d121c;
    --pearl:     #f4f1ea;
    --pearl-dim: rgba(244,241,234,0.62);
    --steel:     #93aac6;      /* soft steel blue — the single accent */
    --steel-dk:  #5d738e;
    --hair:      rgba(147,170,198,0.20);

    /* responsive sizing: --s scales the graphic on small screens,
       --w is the overall length and grows with the viewport */
    --s: 1;
    --gutter: 56px;
    --w: clamp(560px, min(calc(58vw / var(--s)), calc((100vw - 2 * var(--gutter)) / var(--s))), 860px);
  }
  @media (max-width: 900px){ :root{ --s:0.72; --gutter:24px; } }
  @media (max-width: 600px){ :root{ --s:0.5;  --gutter:16px; } }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:transparent;          /* true overlay */
    overflow:hidden;
    font-family:"Jost", sans-serif;
  }
  .stage{ position:relative; width:100%; height:100vh; }

  /* ================= layout: arch portrait + stacked panel ================= */
  .lt{
    position:absolute;
    left:var(--gutter);
    bottom:64px;
    width:var(--w);
    display:flex;
    align-items:flex-end;
    gap:16px;
    transform:scale(var(--s));
    transform-origin:bottom left;
  }

  /* ---- arch portrait: rounded top like a memorial window ---- */
  .arch{
    flex:none;
    width:126px; height:182px;
    padding:3px;
    border-radius:63px 63px 8px 8px;
    background:linear-gradient(170deg, #eef1f5, var(--steel) 45%, var(--steel-dk));
    box-shadow:0 18px 34px rgba(0,0,0,0.45);
    animation:rise .9s cubic-bezier(.19,.9,.22,1) both;
  }
  .arch .ring{
    width:100%; height:100%;
    padding:4px;
    border-radius:60px 60px 5px 5px;
    background:var(--night-b);
  }
  .arch img{
    display:block;
    width:100%; height:100%;
    object-fit:cover;
    border-radius:56px 56px 2px 2px;
    filter:saturate(0.85) contrast(1.04);
  }

  /* ---- main panel ---- */
  .panel{
    position:relative;
    flex:1;
    min-width:0;
    border-radius:12px;
    overflow:hidden;
    background:linear-gradient(160deg, var(--night-a), var(--night-b) 75%);
    border:1px solid var(--hair);
    box-shadow:0 18px 34px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
    animation:wipe 1s cubic-bezier(.19,.9,.22,1) .12s both;
  }

  /* identity */
  .head{ padding:20px 30px 6px; }
  .kicker{
    display:flex; align-items:center; gap:12px;
    font-weight:600;
    font-size:11px;
    letter-spacing:3.2px;
    text-transform:uppercase;
    color:var(--steel);
  }
  .kicker::before{
    content:"";
    width:26px; height:1px;
    background:var(--steel);
    opacity:.8;
  }
  .name{
    margin-top:6px;
    font-family:"Cormorant Garamond", serif;
    font-weight:700;
    font-size:42px;
    line-height:1.02;
    letter-spacing:0.3px;
    color:var(--pearl);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* the one rotating slot */
  .slot-wrap{ padding:6px 30px 0; }
  .slot{
    position:relative;
    height:52px;
    border-top:1px solid var(--hair);
  }
  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center; gap:3px;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .6s ease, transform .6s ease;
    pointer-events:none;
  }
  .slide.is-active{ opacity:1; transform:translateY(0); }
  .line-a{
    font-family:"Cormorant Garamond", serif;
    font-style:italic;
    font-weight:600;
    font-size:21px;
    line-height:1.15;
    color:var(--pearl);
  }
  .slide.info .line-a{
    font-family:"Jost", sans-serif;
    font-style:normal;
    font-weight:500;
    font-size:15px;
    letter-spacing:0.2px;
  }
  .line-b{
    font-weight:600;
    font-size:11px;
    letter-spacing:2.2px;
    text-transform:uppercase;
    color:var(--steel);
  }
  /* thin progress hairline that fills while each slide is up */
  .progress{
    position:absolute; left:0; right:0; top:-1px; height:1px;
    background:transparent;
  }
  .progress i{
    display:block; height:100%; width:0;
    background:var(--steel);
  }
  .progress i.run{ animation:fill var(--slide-ms, 5200ms) linear forwards; }
  @keyframes fill{ from{ width:0; } to{ width:100%; } }

  /* ---- bottom strap: ticker + date/time, one continuous dark band ---- */
  .strap{
    display:flex;
    align-items:center;
    height:34px;
    margin-top:4px;
    background:rgba(0,0,0,0.38);
  }
  .ticker-wrap{
    flex:1; min-width:0;
    height:100%;
    overflow:hidden;
    display:flex; align-items:center;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 26px, #000 calc(100% - 44px), transparent 100%);
            mask-image:linear-gradient(90deg, transparent 0, #000 26px, #000 calc(100% - 44px), transparent 100%);
  }
  .ticker-track{
    display:flex; align-items:center;
    width:max-content;
    white-space:nowrap;
    animation:tickerScroll linear infinite;
  }
  .ticker-track span{
    font-weight:500;
    font-size:11px;
    letter-spacing:0.7px;
    text-transform:uppercase;
    color:var(--pearl-dim);
    padding-right:30px;
  }
  .ticker-track span::after{
    content:"";
    display:inline-block;
    width:4px; height:4px;
    margin-left:30px;
    background:var(--steel);
    transform:rotate(45deg);
    vertical-align:middle;
    opacity:.8;
  }
  @keyframes tickerScroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(calc(-1 * var(--shift, 50%))); }
  }

  .clock{
    flex:none;
    display:flex; align-items:center; gap:8px;
    padding:0 24px 0 6px;
  }
  .clock .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--steel);
    animation:pulseDot 2.6s ease-in-out infinite;
  }
  @keyframes pulseDot{ 0%,100%{ opacity:.3; } 50%{ opacity:1; } }
  .clock span{
    font-weight:600;
    font-size:11.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--pearl);
    white-space:nowrap;
  }

  /* ---- entrance ---- */
  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes wipe{
    from{ clip-path:inset(0 100% 0 0 round 12px); opacity:.2; }
    to{   clip-path:inset(0 0 0 0 round 12px);   opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    .arch, .panel{ animation:none; }
    .slide{ transition:none; }
    .ticker-track{ animation:none; }
    .progress i.run{ animation:none; width:100%; }
  }

  /* 2026 redesign: a real memorial arch with a stepped, open composition. */
  :root{--w:clamp(700px,min(calc(68vw / var(--s)),calc((100vw - 2 * var(--gutter)) / var(--s))),1040px);}
  .lt{gap:0;align-items:flex-end;bottom:58px;min-height:236px;}
  .arch{
    width:172px;height:224px;
    padding:5px;
    border-radius:86px 86px 10px 10px;
    background:linear-gradient(150deg,var(--pearl),var(--steel) 48%,var(--steel-dk));
    box-shadow:0 24px 46px rgba(0,0,0,.34);
    position:relative;z-index:5;
  }
  .arch::after{
    content:"";position:absolute;inset:11px;border:1px solid color-mix(in srgb,var(--pearl),transparent 45%);
    border-radius:72px 72px 5px 5px;pointer-events:none;
  }
  .arch .ring{border-radius:78px 78px 6px 6px;padding:5px;background:var(--night-b);}
  .arch img{border-radius:72px 72px 3px 3px;}
  .panel{
    flex:1;min-width:0;height:184px;margin-left:-18px;
    border-radius:0 8px 8px 0;
    background:linear-gradient(102deg,var(--night-a),var(--night-b));
    box-shadow:0 20px 42px rgba(0,0,0,.3);
    border:0;overflow:hidden;
  }
  .panel::before{
    content:"";position:absolute;left:0;right:0;top:0;height:5px;
    background:linear-gradient(90deg,var(--steel),var(--steel-dk) 62%,transparent);
  }
  .head{height:96px;padding:20px 38px 8px 52px;display:flex;flex-direction:column;justify-content:center;}
  .kicker{font-size:11px;letter-spacing:2.6px;color:var(--steel);}
  .name{margin-top:5px;font-size:34px;line-height:1.02;color:var(--pearl);}
  .slot-wrap{padding:0 38px 0 52px;}
  .slot{height:50px;}
  .line-a{font-size:18px;}
  .strap{height:34px;margin-top:0;padding-left:42px;background:color-mix(in srgb,var(--night-b),#000 20%);}
  .clock{padding-right:24px;}

  /* Gallery Tribute: a matted photograph with layered editorial plaques. */
  .lt{height:272px;align-items:flex-end;overflow:visible;}
  .arch{
    width:184px;height:224px;border-radius:5px;padding:4px;
    background:var(--steel);
    box-shadow:10px 10px 0 var(--steel-dk),0 25px 42px rgba(0,0,0,.3);filter:none;z-index:8;
    transform:rotate(-1deg);
    animation:galleryRise .9s cubic-bezier(.19,.9,.22,1) .2s both;
  }
  .arch .ring{border-radius:3px;padding:0;background:var(--night-b);overflow:hidden;}
  .arch img{border-radius:3px;clip-path:none;filter:saturate(.86) contrast(1.03);}
  .arch::before{
    content:"";position:absolute;inset:10px;border:1px solid color-mix(in srgb,var(--pearl),transparent 38%);
    border-radius:2px;pointer-events:none;
  }
  .arch::after{display:none;}
  @keyframes galleryRise{
    from{opacity:0;transform:translateY(16px) rotate(-1deg);}
    to{opacity:1;transform:translateY(0) rotate(-1deg);}
  }
  .panel{
    height:216px;margin-left:-24px;overflow:visible;background:transparent;
    box-shadow:none;border-radius:0;
  }
  .panel::before{display:none;}
  .head{
    position:absolute;left:0;right:54px;top:0;height:112px;
    padding:22px 40px 16px 60px;
    border-radius:0 6px 6px 0;
    background:var(--night-a);
    box-shadow:0 18px 36px rgba(0,0,0,.28);
    border-left:5px solid var(--steel);
  }
  .name{font-size:38px;}
  .slot-wrap{
    position:absolute;left:64px;right:0;top:100px;height:76px;
    padding:12px 34px 8px;
    background:var(--pearl);
    box-shadow:0 16px 30px rgba(0,0,0,.18);
  }
  .slot{height:56px;border-top:0;}
  .progress{top:auto;bottom:0;background:color-mix(in srgb,var(--steel),transparent 72%);}
  .line-a,.slide.info .line-a{color:var(--night-a);}
  .line-b{color:var(--steel-dk);}
  .strap{
    position:absolute;left:22px;right:28px;bottom:0;height:36px;margin:0;
    padding-left:48px;border-radius:0 0 6px 0;
    background:var(--night-b);
    box-shadow:0 12px 24px rgba(0,0,0,.2);
  }
</style>
</head>
<body>

<div class="stage">
  <div class="lt" style="visibility:hidden;opacity:0">

    <div class="arch">
      <div class="ring">
        <img id="portrait" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=320&h=420&fit=crop" alt="Portrait">
      </div>
    </div>

    <div class="panel">
      <div class="head">
        <div class="kicker" id="kickerLabel">{{ settings.secondary_text or '' }}</div>
        <div class="name" id="subjectName">{{ settings.main_text or '' }}</div>
      </div>

      <div class="slot-wrap">
        <div class="slot">
          <div class="progress"><i id="progressFill"></i></div>
          <div id="slideStage"><!-- slides injected by script --></div>
        </div>
      </div>

      <div class="strap">
        <div class="ticker-wrap"><div class="ticker-track" id="tickerTrack"></div></div>
        <div class="clock">
          <span class="dot"></span>
          <span id="timeLabel">-- --  ·  --:--</span>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  window.MEMORIAL_SETTINGS = {{ settings|tojson }};
  const savedSettings = window.MEMORIAL_SETTINGS;
  const savedPhrases = (savedSettings.secondary_phrases || []).filter(Boolean);
  const memorial = {
    subject: {
      label: savedSettings.secondary_text || '',
      name: savedSettings.main_text || '',
      photo_url: savedSettings.category_image ? '/static/' + savedSettings.category_image : ''
    },
    meta: {
      relation: savedPhrases[0] || savedSettings.secondary_text || '',
      birth_date: '',
      death_date: ''
    },
    tributes: [],
    service_details: savedPhrases.slice(1).map((text, index) => ({order:index + 1, text})),
    ticker_messages: [{order:1, text:savedSettings.ticker_text || ''}]
  };

  // ---- identity ----
  document.getElementById('kickerLabel').textContent = memorial.subject.label;
  document.getElementById('subjectName').textContent = memorial.subject.name;
  if (memorial.subject.photo_url) document.getElementById('portrait').src = memorial.subject.photo_url;

  // ---- rotating slides ----
  const SLIDE_MS = 5200;
  document.documentElement.style.setProperty('--slide-ms', SLIDE_MS + 'ms');

  const slides = [
    {
      type: 'meta',
      lineA: memorial.meta.relation,
      lineB: memorial.meta.birth_date + '  \u2014  ' + memorial.meta.death_date
    },
    ...memorial.tributes.map(t => ({ type: 'tribute', lineA: '\u201C' + t.text + '\u201D' })),
    ...memorial.service_details
      .slice().sort((a, b) => a.order - b.order)
      .map(d => ({ type: 'info', lineA: d.text }))
  ];

  const stage = document.getElementById('slideStage');
  slides.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide ' + s.type + (i === 0 ? ' is-active' : '');
    const a = document.createElement('div');
    a.className = 'line-a';
    a.textContent = s.lineA;
    el.appendChild(a);
    if (s.lineB) {
      const b = document.createElement('div');
      b.className = 'line-b';
      b.textContent = s.lineB;
      el.appendChild(b);
    }
    stage.appendChild(el);
  });

  const slideEls = stage.querySelectorAll('.slide');
  const fill = document.getElementById('progressFill');
  function restartProgress(){
    fill.classList.remove('run');
    void fill.offsetWidth;
    fill.classList.add('run');
  }
  let activeIndex = 0;
  restartProgress();
  setInterval(() => {
    slideEls[activeIndex].classList.remove('is-active');
    activeIndex = (activeIndex + 1) % slideEls.length;
    slideEls[activeIndex].classList.add('is-active');
    restartProgress();
  }, SLIDE_MS);

  // ---- live date + time ----
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function updateClock(){
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    document.getElementById('timeLabel').textContent =
      MONTHS[now.getMonth()] + ' ' + now.getDate() + '  \u00B7  ' + h + ':' + (m < 10 ? '0' + m : m) + ' ' + ampm;
  }
  updateClock();
  setInterval(updateClock, 15000);

  // ---- ticker: repeat messages enough to always fill the strap,
  // scroll exactly one copy for a seamless loop, rebuild on resize ----
  (function initTicker(){
    const track = document.getElementById('tickerTrack');
    const wrap  = track.parentElement;
    const items = memorial.ticker_messages.slice().sort((a, b) => a.order - b.order);
    const PX_PER_SEC = 70;

    function addPass(){
      items.forEach(item => {
        const span = document.createElement('span');
        span.textContent = item.text;
        track.appendChild(span);
      });
    }

    function build(){
      track.innerHTML = '';
      track.style.animation = 'none';
      addPass();
      const copyW = track.scrollWidth;
      if (!copyW) return;
      const need = wrap.clientWidth + copyW;
      let guard = 0;
      while (track.scrollWidth < need && guard++ < 40) addPass();
      track.style.setProperty('--shift', copyW + 'px');
      void track.offsetWidth;
      track.style.animation = '';
      track.style.animationDuration = Math.max(copyW / PX_PER_SEC, 8) + 's';
    }

    const start = () => requestAnimationFrame(build);
    (document.fonts && document.fonts.ready) ? document.fonts.ready.then(start) : start();

    let t;
    window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(build, 150); });
  })();
</script>

<script>
window.MEMORIAL_VARIANT = 'arch';
window.MEMORIAL_PREVIEW = {{ preview_mode|default(false)|tojson }};
</script>
<script src="{{ url_for('static', filename='js/memorial-template-bridge.js') }}"></script>
</body>
</html>
