<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In Memoriam — Lower Third (Band)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* warm ink black + rose quartz + pearl, lavender-grey for the clock */
    --ink:       #0d0b0f;
    --rose:      #d8b4b0;
    --rose-dk:   #a47f7c;
    --pearl:     #f5f1ea;
    --pearl-dim: rgba(245,241,234,0.64);
    --time:      #b9b6d3;

    --pw: 136px;                      /* portrait width */

    /* responsive: --s scales on small screens, --w is the band length */
    --s: 1;
    --gutter: 56px;
    --w: clamp(760px, min(calc(72vw / var(--s)), calc(100vw / var(--s))), 1160px);
  }
  @media (max-width: 900px){ :root{ --s:0.72; --gutter:24px; } }
  @media (max-width: 600px){ :root{ --s:0.5;  --gutter:16px; } }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:transparent;           /* true overlay */
    overflow:hidden;
    font-family:"Jost", sans-serif;
  }
  .stage{ position:relative; width:100%; height:100vh; }

  /* flush to the left edge of the screen; the right end fades out */
  .lt{
    position:absolute;
    left:0;
    bottom:56px;
    width:var(--w);
    height:224px;
    transform:scale(var(--s));
    transform-origin:bottom left;
  }

  /* ================= the band ================= */
  .band{
    position:absolute;
    left:0; bottom:0;
    width:100%; height:184px;
    container-type:inline-size;
  }
  .band-bg{
    position:absolute; inset:0;
    background:
      radial-gradient(60% 130% at 0% 100%, rgba(216,180,176,0.09), transparent 62%),
      linear-gradient(90deg, rgba(13,11,15,0.97) 0, rgba(13,11,15,0.95) 86%, rgba(13,11,15,0) 100%);
    animation:wipe 1.1s cubic-bezier(.19,.9,.22,1) .1s both;
  }
  /* hairline along the top edge */
  .band-bg::before{
    content:"";
    position:absolute; left:0; right:0; top:0; height:1px;
    background:linear-gradient(90deg, rgba(216,180,176,0.7), rgba(216,180,176,0.35) 70%, rgba(216,180,176,0) 100%);
  }

  .main{
    position:absolute; left:0; right:0; top:0; bottom:34px;
    display:flex; align-items:center; gap:28px;
    padding:0 11% 0 calc(var(--gutter) + var(--pw) + 34px);
    animation:fadeIn .9s ease .5s both;
  }

  /* ---- left column: identity ---- */
  .id{ flex:1; min-width:0; }
  .kicker{
    display:flex; align-items:center; gap:12px;
    font-weight:600;
    font-size:11px;
    letter-spacing:3.2px;
    text-transform:uppercase;
    color:var(--rose);
  }
  .kicker::before{
    content:"";
    width:16px; height:2px;
    background:var(--rose);
    flex:none;
  }
  .name{
    margin-top:8px;
    font-family:"Bodoni Moda", serif;
    font-weight:600;
    font-size:40px;
    line-height:1.08;
    letter-spacing:0.2px;
    color:var(--pearl);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    text-wrap:balance;
  }

  .vr{
    flex:none;
    align-self:stretch;
    width:1px;
    margin:22px 0;
    background:linear-gradient(180deg, rgba(216,180,176,0), rgba(216,180,176,0.65), rgba(216,180,176,0));
    transform-origin:top;
    animation:growY 1s cubic-bezier(.19,.9,.22,1) .8s both;
  }

  /* ---- right column: the single rotating slot ---- */
  .info{ flex:none; width:300px; }
  .info-head{
    display:flex; align-items:center; justify-content:space-between;
    font-weight:600;
    font-size:10.5px;
    letter-spacing:2.6px;
    text-transform:uppercase;
    color:var(--rose);
  }
  .counter{
    letter-spacing:1.5px;
    color:var(--rose-dk);
    font-variant-numeric:tabular-nums;
  }
  .track{
    margin-top:8px;
    height:1px;
    background:rgba(245,241,234,0.14);
  }
  .track i{ display:block; height:100%; width:0; background:var(--rose); }
  .track i.run{ animation:fill var(--slide-ms, 5200ms) linear forwards; }
  @keyframes fill{ from{ width:0; } to{ width:100%; } }

  .slot{ position:relative; height:76px; }
  .slide{
    position:absolute; inset:0;
    padding-top:10px;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .6s ease, transform .6s ease;
    pointer-events:none;
  }
  .slide.is-active{ opacity:1; transform:translateY(0); }
  .line-a{
    font-family:"Bodoni Moda", serif;
    font-style:italic;
    font-weight:500;
    font-size:17px;
    line-height:1.3;
    color:var(--pearl);
  }
  .slide.info-type .line-a{
    font-family:"Jost", sans-serif;
    font-style:normal;
    font-weight:500;
    font-size:14px;
    line-height:1.35;
    letter-spacing:0.15px;
    color:var(--pearl-dim);
  }
  .line-b{
    margin-top:5px;
    font-weight:600;
    font-size:10.5px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--rose-dk);
  }

  /* narrower bands: tighten the columns so nothing gets squeezed */
  @container (max-width: 900px){
    .name{ font-size:34px; }
    .info{ width:236px; }
    .main{ gap:22px; }
  }

  /* ================= bottom strap ================= */
  .strap{
    position:absolute; left:0; right:0; bottom:0;
    height:34px;
    display:flex; align-items:center;
    background:rgba(0,0,0,0.34);
    animation:fadeIn .9s ease .7s both;
  }
  .strap::before{
    content:"";
    position:absolute; left:0; right:0; top:0; height:1px;
    background:linear-gradient(90deg, rgba(216,180,176,0.35), rgba(216,180,176,0.14) 80%, rgba(216,180,176,0));
  }
  /* clock sits right beneath the portrait, like a caption */
  .clock{
    flex:none;
    margin-left:var(--gutter);
    width:var(--pw);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .clock .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--time);
    animation:pulseDot 2.6s ease-in-out infinite;
    flex:none;
  }
  @keyframes pulseDot{ 0%,100%{ opacity:.3; } 50%{ opacity:1; } }
  .clock span{
    font-weight:600;
    font-size:11px;
    letter-spacing:0.9px;
    text-transform:uppercase;
    color:var(--time);
    white-space:nowrap;
  }
  .ticker-wrap{
    flex:1; min-width:0; height:100%;
    margin-left:34px; margin-right:11%;
    overflow:hidden;
    display:flex; align-items:center;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 26px, #000 calc(100% - 40px), transparent 100%);
            mask-image:linear-gradient(90deg, transparent 0, #000 26px, #000 calc(100% - 40px), transparent 100%);
  }
  .ticker-track{
    display:flex; align-items:center;
    width:max-content;
    white-space:nowrap;
    animation:tickerScroll linear infinite;
  }
  .ticker-track span{
    font-weight:500;
    font-size:11px;
    letter-spacing:0.7px;
    text-transform:uppercase;
    color:var(--pearl-dim);
    padding-right:30px;
  }
  .ticker-track span::after{
    content:"";
    display:inline-block;
    width:4px; height:4px;
    margin-left:30px;
    background:var(--rose);
    transform:rotate(45deg);
    vertical-align:middle;
    opacity:.8;
  }
  @keyframes tickerScroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(calc(-1 * var(--shift, 50%))); }
  }

  /* ================= tall portrait with corner brackets ================= */
  .portrait{
    position:absolute;
    left:var(--gutter);
    bottom:44px;
    width:var(--pw); height:172px;
    z-index:5;
    animation:rise .9s cubic-bezier(.19,.9,.22,1) .2s both;
  }
  .portrait .frame{
    position:absolute; inset:0;
    padding:5px;
    background:var(--ink);
    border:1px solid rgba(245,241,234,0.45);
    box-shadow:0 18px 30px rgba(0,0,0,0.55);
  }
  .portrait img{
    display:block;
    width:100%; height:100%;
    object-fit:cover;
    filter:saturate(0.85) contrast(1.04);
    box-shadow:inset 0 0 22px rgba(0,0,0,0.45);
  }
  .portrait::before, .portrait::after{
    content:"";
    position:absolute;
    width:28px; height:28px;
    border:2px solid var(--rose);
    pointer-events:none;
  }
  .portrait::before{ top:-9px; left:-9px; border-right:0; border-bottom:0; }
  .portrait::after{ bottom:-9px; right:-9px; border-left:0; border-top:0; }

  /* ================= motion ================= */
  @keyframes wipe{
    from{ clip-path:inset(0 100% 0 0); }
    to{   clip-path:inset(0 0 0 0); }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(16px); }
    to{   opacity:1; transform:translateY(0); }
  }
  @keyframes fadeIn{
    from{ opacity:0; }
    to{   opacity:1; }
  }
  @keyframes growY{
    from{ transform:scaleY(0); }
    to{   transform:scaleY(1); }
  }

  @media (prefers-reduced-motion: reduce){
    .band-bg, .main, .strap, .vr, .portrait{ animation:none; }
    .slide{ transition:none; }
    .ticker-track{ animation:none; }
    .track i.run{ animation:none; width:100%; }
  }

  /* 2026 redesign: a bright editorial ribbon with a clear reading order. */
  :root{
    --pw:168px;
    --w:clamp(820px, min(calc(78vw / var(--s)), calc(100vw / var(--s))), 1240px);
  }
  .lt{height:220px;bottom:58px;}
  .band{height:174px;bottom:0;}
  .band-bg{
    inset:16px 0 0 82px;
    border-radius:0 8px 8px 0;
    background:linear-gradient(96deg,var(--ink) 0%,var(--ink) 76%,color-mix(in srgb,var(--ink),transparent 8%) 100%);
    box-shadow:0 20px 46px rgba(0,0,0,.28);
  }
  .band-bg::before{height:5px;background:linear-gradient(90deg,var(--rose),var(--rose-dk) 55%,transparent 96%);}
  .main{
    left:82px;top:16px;bottom:34px;
    gap:38px;
    padding:0 48px 0 calc(var(--pw) + 38px);
  }
  .id{padding-right:8px;}
  .kicker{font-size:12px;letter-spacing:2.4px;}
  .kicker::before{width:28px;height:3px;}
  .name{margin-top:9px;font-size:38px;line-height:1.02;text-wrap:balance;}
  .vr{margin:24px 0;background:linear-gradient(180deg,transparent,var(--rose),transparent);}
  .info{width:300px;}
  .info-head{font-size:10px;}
  .line-a{font-size:18px;}
  .strap{left:82px;right:0;height:34px;border-radius:0 0 8px 0;background:color-mix(in srgb,var(--ink),#000 24%);}
  .clock{margin-left:calc(var(--pw) + 38px);width:auto;min-width:116px;justify-content:flex-start;}
  .ticker-wrap{margin-left:22px;margin-right:40px;}
  .portrait{
    left:0;bottom:15px;width:var(--pw);height:var(--pw);
    border-radius:50%;padding:5px;
    background:linear-gradient(145deg,var(--pearl),var(--rose) 52%,var(--rose-dk));
    box-shadow:0 22px 44px rgba(0,0,0,.34);
  }
  .portrait .frame{inset:5px;padding:5px;border:0;border-radius:50%;background:var(--ink);box-shadow:none;}
  .portrait img{border-radius:50%;}
  .portrait::before,.portrait::after{display:none;}
  @container (max-width:900px){
    .name{font-size:32px;}
    .info{width:250px;}
    .main{gap:26px;padding-right:32px;}
  }

  /* Editorial Ribbon: deliberately asymmetric, built from three distinct planes. */
  .lt{height:242px;}
  .band{height:202px;overflow:visible;}
  .band-bg{
    left:112px;right:178px;top:18px;bottom:38px;
    border-radius:4px;
    clip-path:polygon(0 0,94% 0,100% 22%,100% 100%,0 100%);
    background:var(--ink);
  }
  .band-bg::after{
    content:"";position:absolute;left:0;bottom:0;width:9px;height:72%;background:var(--rose);
  }
  .main{
    left:112px;right:0;top:18px;bottom:38px;
    display:block;padding:0;
  }
  .id{
    position:absolute;left:58px;right:430px;top:25px;bottom:20px;
    display:flex;flex-direction:column;justify-content:center;
  }
  .kicker::before{display:none;}
  .kicker{font-size:11px;letter-spacing:3px;}
  .name{font-size:40px;max-width:100%;}
  .vr{display:none;}
  .info{
    position:absolute;right:0;top:34px;width:380px;height:122px;
    padding:18px 28px;
    background:var(--rose);
    box-shadow:0 16px 34px rgba(0,0,0,.24);
  }
  .info-head{color:var(--ink);}
  .counter{color:color-mix(in srgb,var(--ink),transparent 35%);}
  .track{background:color-mix(in srgb,var(--ink),transparent 75%);}
  .track i{background:var(--ink);}
  .slot{height:67px;}
  .line-a,.slide.info-type .line-a{color:var(--ink);}
  .line-b{color:color-mix(in srgb,var(--ink),transparent 28%);}
  .portrait{
    left:0;bottom:12px;width:158px;height:210px;
    border-radius:76px 8px 76px 8px;padding:4px;
    background:var(--rose);box-shadow:0 22px 40px rgba(0,0,0,.32);
  }
  .portrait .frame{inset:4px;padding:5px;border-radius:72px 6px 72px 6px;background:var(--ink);}
  .portrait img{border-radius:67px 3px 67px 3px;}
  .portrait::before,.portrait::after{display:block;width:26px;height:26px;border-color:var(--pearl);z-index:3;}
  .portrait::before{top:-8px;left:-8px;border-width:1px 0 0 1px;}
  .portrait::after{right:-8px;bottom:-8px;border-width:0 1px 1px 0;}
  .strap{left:112px;right:178px;height:38px;border-radius:0;background:color-mix(in srgb,var(--ink),#000 28%);}
  .clock{margin-left:58px;min-width:120px;}
  .ticker-wrap{margin-right:24px;}
  @container (max-width:900px){
    .id{right:350px;}.info{width:320px}.name{font-size:34px}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="lt" style="visibility:hidden;opacity:0">

    <div class="band">
      <div class="band-bg"></div>

      <div class="main">
        <div class="id">
          <div class="kicker" id="kickerLabel">In Loving Memory</div>
          <div class="name" id="subjectName">Margaret Eleanor Hayes</div>
        </div>

        <div class="vr"></div>

        <div class="info">
          <div class="info-head">
            <span id="infoLabel">Remembered as</span>
            <span class="counter" id="counter">01 / 05</span>
          </div>
          <div class="track"><i id="progressFill"></i></div>
          <div class="slot" id="slideStage"><!-- slides injected by script --></div>
        </div>
      </div>

      <div class="strap">
        <div class="clock">
          <span class="dot"></span>
          <span id="timeLabel">-- --  ·  --:--</span>
        </div>
        <div class="ticker-wrap"><div class="ticker-track" id="tickerTrack"></div></div>
      </div>
    </div>

    <div class="portrait">
      <div class="frame">
        <img id="portrait" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=320&h=420&fit=crop" alt="Portrait">
      </div>
    </div>

  </div>
</div>

<script>
  /* =========================================================
     DATA MODEL — identical shape to the other designs, so one
     backend payload can drive any of them.
     ========================================================= */
  const memorial = {
    subject: {
      label: "In Loving Memory",
      name: "Margaret Eleanor Hayes",
      photo_url: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=320&h=420&fit=crop"
    },
    meta: {
      relation: "Beloved mother, grandmother, and friend",
      birth_date: "March 4, 1941",
      death_date: "September 9, 2026"
    },
    tributes: [
      { text: "She kept the family together, one Sunday supper at a time." }
    ],
    service_details: [
      { order: 1, text: "Service begins at 11:00 AM in the Fellowship Hall" },
      { order: 2, text: "Reception follows immediately after in the garden courtyard" },
      { order: 3, text: "In lieu of flowers, gifts may be made to St. Jude's Hospice in her memory" }
    ],
    ticker_messages: [
      { order: 1, text: "Margaret Eleanor Hayes \u2014 March 4, 1941 to September 9, 2026" },
      { order: 2, text: "Service begins at 11:00 AM in the Fellowship Hall" },
      { order: 3, text: "Reception follows in the garden courtyard" },
      { order: 4, text: "Gifts may be made to St. Jude's Hospice in her memory" }
    ]
  };

  // ---- identity ----
  document.getElementById('kickerLabel').textContent = memorial.subject.label;
  document.getElementById('subjectName').textContent = memorial.subject.name;
  document.getElementById('portrait').src = memorial.subject.photo_url;

  // ---- rotating slides: each carries its own small heading ----
  const SLIDE_MS = 5200;
  document.documentElement.style.setProperty('--slide-ms', SLIDE_MS + 'ms');

  const slides = [
    {
      type: 'meta', label: 'Remembered as',
      lineA: memorial.meta.relation,
      lineB: memorial.meta.birth_date + '  \u2014  ' + memorial.meta.death_date
    },
    ...memorial.tributes.map(t => ({ type: 'tribute', label: 'Tribute', lineA: '\u201C' + t.text + '\u201D' })),
    ...memorial.service_details
      .slice().sort((a, b) => a.order - b.order)
      .map(d => ({ type: 'info-type', label: 'Service details', lineA: d.text }))
  ];

  const pad = n => (n < 10 ? '0' : '') + n;
  const stage = document.getElementById('slideStage');
  slides.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide ' + s.type + (i === 0 ? ' is-active' : '');
    const a = document.createElement('div');
    a.className = 'line-a';
    a.textContent = s.lineA;
    el.appendChild(a);
    if (s.lineB) {
      const b = document.createElement('div');
      b.className = 'line-b';
      b.textContent = s.lineB;
      el.appendChild(b);
    }
    stage.appendChild(el);
  });

  const slideEls = stage.querySelectorAll('.slide');
  const labelEl = document.getElementById('infoLabel');
  const counterEl = document.getElementById('counter');
  const fill = document.getElementById('progressFill');

  function show(i){
    labelEl.textContent = slides[i].label;
    counterEl.textContent = pad(i + 1) + ' / ' + pad(slides.length);
    fill.classList.remove('run');
    void fill.offsetWidth;
    fill.classList.add('run');
  }
  let activeIndex = 0;
  show(0);
  setInterval(() => {
    slideEls[activeIndex].classList.remove('is-active');
    activeIndex = (activeIndex + 1) % slideEls.length;
    slideEls[activeIndex].classList.add('is-active');
    show(activeIndex);
  }, SLIDE_MS);

  // ---- live date + time ----
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function updateClock(){
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    document.getElementById('timeLabel').textContent =
      MONTHS[now.getMonth()] + ' ' + now.getDate() + '  \u00B7  ' + h + ':' + pad(m) + ' ' + ampm;
  }
  updateClock();
  setInterval(updateClock, 15000);

  // ---- ticker: repeat messages enough to always fill the strap,
  // scroll exactly one copy for a seamless loop, rebuild on resize ----
  (function initTicker(){
    const track = document.getElementById('tickerTrack');
    const wrap  = track.parentElement;
    const items = memorial.ticker_messages.slice().sort((a, b) => a.order - b.order);
    const PX_PER_SEC = 70;

    function addPass(){
      items.forEach(item => {
        const span = document.createElement('span');
        span.textContent = item.text;
        track.appendChild(span);
      });
    }

    function build(){
      track.innerHTML = '';
      track.style.animation = 'none';
      addPass();
      const copyW = track.scrollWidth;
      if (!copyW) return;
      const need = wrap.clientWidth + copyW;
      let guard = 0;
      while (track.scrollWidth < need && guard++ < 40) addPass();
      track.style.setProperty('--shift', copyW + 'px');
      void track.offsetWidth;
      track.style.animation = '';
      track.style.animationDuration = Math.max(copyW / PX_PER_SEC, 8) + 's';
    }

    const start = () => requestAnimationFrame(build);
    (document.fonts && document.fonts.ready) ? document.fonts.ready.then(start) : start();

    let t;
    window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(build, 150); });
  })();
</script>

<script>
window.MEMORIAL_SETTINGS = {{ settings|tojson }};
window.MEMORIAL_VARIANT = 'band';
window.MEMORIAL_PREVIEW = {{ preview_mode|default(false)|tojson }};
</script>
<script src="{{ url_for('static', filename='js/memorial-template-bridge.js') }}"></script>
</body>
</html>
